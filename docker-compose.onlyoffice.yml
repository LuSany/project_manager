services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: pm-onlyoffice
    ports:
      - "8082:80"
    environment:
      - JWT_ENABLED=false
      # 确保服务在容器重启后正确初始化
      - ONLYOFFICE_DATA_CONTAINER=false
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_rabbitmq:/var/lib/rabbitmq
      - onlyoffice_redis:/var/lib/redis
      # 持久化配置：挂载配置文件到数据目录
      - ./onlyoffice/local.json:/var/www/onlyoffice/Data/local.json:ro
    networks:
      - pm-network
    restart: always
    # 使用 tini 作为 init 进程，更好地处理信号和子进程
    init: true
    healthcheck:
      # 检查多个关键服务状态，确保完整健康
      test: ["CMD-SHELL", "curl -f http://localhost/healthcheck && pg_isready -h localhost || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 确保服务按正确顺序启动
    stop_grace_period: 60s

networks:
  pm-network:
    name: docker_pm-network
    external: true

volumes:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_db:
  onlyoffice_lib:
  onlyoffice_rabbitmq:
  onlyoffice_redis: