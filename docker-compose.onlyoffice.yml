version: '3.8'

services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: pm-onlyoffice
    ports:
      - '8082:80'
    environment:
      - JWT_ENABLED=false
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    networks:
      - pm-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost/healthcheck || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    extra_hosts:
      - 'host.docker.internal:host-gateway'

networks:
  pm-network:
    name: docker_pm-network
    external: true

volumes:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_db:
